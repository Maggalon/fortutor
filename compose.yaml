name: fortutor-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fortutor
      POSTGRES_PASSWORD: fortutor_local_only
      POSTGRES_DB: fortutor
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortutor -d fortutor"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis:/data"]
volumes:
  postgres:
  redis:
