name: For Tutor CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fortutor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fortutor
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: fortutor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fortutor -d fortutor_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 12.4.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen && pnpm run typecheck
      - run: pnpm run test
        env:
          TEST_DATABASE_URL: postgresql://fortutor:test_only@localhost:5432/fortutor_test
          TEST_REDIS_URL: redis://localhost:6379
      - name: Validate deployment files
        run: |
          docker compose --env-file deploy/env.production.example -f deploy/compose.production.yml config --quiet
          bash -n deploy/update.sh deploy/backup.sh
      - run: pnpm run build
        if: github.event_name == 'pull_request'
        env: { NEXT_TELEMETRY_DISABLED: "1" }
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Build on GitHub and transfer ready images over SSH
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          DEPLOY_ROOT: ${{ vars.VPS_DEPLOY_ROOT || 'home/maggalon/for-tutor' }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[a-zA-Z0-9_-]+(/[a-zA-Z0-9_-]+)*$ ]]
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" != "$GITHUB_SHA" ]]; then echo 'Newer main exists; skipping stale release.'; exit 0; fi
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          ssh_args=(-i "$RUNNER_TEMP/deploy_key" -p "$VPS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          target="$VPS_USER@$VPS_HOST"
          platform=$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')
          ssh "${ssh_args[@]}" "$target" "bash -s -- '$DEPLOY_ROOT' '$platform'" <<'REMOTE'
          set -euo pipefail
          test -d "$1" && test -r "$1/.env.production" && test -w "$1"
          docker info >/dev/null
          docker compose version
          test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = "$2" || { echo 'VPS and runner architectures must match'; exit 1; }
          mkdir -p "$1/deploy"
          REMOTE
          docker build --target web --label io.fortutor.component=web --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "fortutor-web:$GITHUB_SHA" .
          docker build --target worker --label io.fortutor.component=worker --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "fortutor-worker:$GITHUB_SHA" .
          docker image save "fortutor-web:$GITHUB_SHA" "fortutor-worker:$GITHUB_SHA" | gzip -1 | ssh "${ssh_args[@]}" "$target" 'docker image load'
          for file in compose.production.yml update.sh backup.sh; do
            ssh "${ssh_args[@]}" "$target" "cat > '$DEPLOY_ROOT/deploy/$file.incoming'" < "deploy/$file"
          done
          ssh "${ssh_args[@]}" "$target" "bash -s -- '$DEPLOY_ROOT' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          export WEB_IMAGE="fortutor-web:$2" WORKER_IMAGE="fortutor-worker:$2"
          docker compose --env-file .env.production -f deploy/compose.production.yml.incoming config --quiet
          for file in compose.production.yml update.sh backup.sh; do mv "deploy/$file.incoming" "deploy/$file"; done
          bash deploy/update.sh "$WEB_IMAGE" "$WORKER_IMAGE"
          REMOTE
      - name: Remove temporary SSH files
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
