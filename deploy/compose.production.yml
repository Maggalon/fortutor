name: ${COMPOSE_PROJECT_NAME:-fortutor}
x-logging: &logging
  driver: local
  options: { max-size: "10m", max-file: "3" }
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    environment:
      POSTGRES_USER: fortutor
      POSTGRES_DB: fortutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortutor -d fortutor"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD}",
      ]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
  migrate:
    image: ${WORKER_IMAGE:?Set WORKER_IMAGE}
    pull_policy: never
    networks: [backend]
    env_file:
      - path: ../.env.production
        required: false
    environment: &app-env
      NODE_ENV: production
      DEMO_MODE: "false"
      DATABASE_SSL: "false"
      DATABASE_URL: postgresql://fortutor:${POSTGRES_PASSWORD}@postgres:5432/fortutor
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    command: ["node", "--import", "tsx", "scripts/migrate.ts"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE}
    restart: unless-stopped
    pull_policy: never
    init: true
    logging: *logging
    networks:
      backend:
      proxy:
        aliases: ["${PROXY_ALIAS:-fortutor}"]
    env_file:
      - path: ../.env.production
        required: false
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    image: ${WORKER_IMAGE}
    restart: unless-stopped
    pull_policy: never
    init: true
    networks: [backend]
    logging: *logging
    env_file:
      - path: ../.env.production
        required: false
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 120s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "try{const t=Number(require('node:fs').readFileSync('/tmp/fortutor-worker-heartbeat','utf8'));process.exit(t>0&&Date.now()-t<1200000?0:1)}catch{process.exit(1)}"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
networks:
  backend:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
volumes:
  postgres:
  redis:
